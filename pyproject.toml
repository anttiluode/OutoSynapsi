[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outosynapsi"
version = "0.1.0"
description = "Finite spectral-triple laboratory for traffic-driven metric plasticity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antti Luode" }]
dependencies = ["numpy>=1.26"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
